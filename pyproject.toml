[build-system]
requires = ["scikit-build-core>=0.11,<0.12", "nanobind==2.14.0"]
build-backend = "scikit_build_core.build"

[project]
name = "tt-wavelet"
dynamic = ["version"]
description = "Standalone lifting wavelet transforms for Tenstorrent TTNN tensors"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = ["ttnn==0.79.0"]
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "licenses/TT-Metal-LICENSE", "licenses/TT-Metal-NOTICE", "licenses/nanobind-LICENSE", "licenses/robin-map-LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/ke1rro/tt-wavelet"
Issues = "https://github.com/ke1rro/tt-wavelet/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/ttwt"]
install.components = ["ttwt-python"]
build.targets = ["_ttwt"]
sdist.exclude = ["third_party/**", "EXTRACTION_RESEARCH.md", "PHASE*.md", "TT_UMD_REFERENCE.md"]

[tool.scikit-build.cmake.define]
TT_WAVELET_TT_METAL_MODE = "SYSTEM"
TT_WAVELET_BUILD_PYTHON = "ON"
TT_WAVELET_RELOCATABLE_RESOURCES = "ON"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '^(?P<value>\d+\.\d+\.\d+)\s*$'

[tool.black]
line-length = 100
target-version = ["py310"]
include = '(python/.*|tests/python/.*|src/ttwt/schemes/generate_wavelet_scheme_headers)\.py$'
force-exclude = '/(third_party|build[^/]*|generated|\.git)/'
