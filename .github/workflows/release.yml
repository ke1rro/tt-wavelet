name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CC: clang-20
      CXX: clang++-20
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(git -C third_party/tt-metal rev-parse HEAD)" = de546d3b146758714d900f11b218c8f9c805f410
      - name: Install build prerequisites
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main' | sudo tee /etc/apt/sources.list.d/llvm-20.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-20 g++-12 ninja-build pkg-config libhwloc-dev libnuma-dev libcapstone-dev
          python -m pip install build wheel cmake==4.2.3 pytest packaging
      - name: Build release wheel
        run: python -m build --wheel -Ccmake.define.TT_WAVELET_TT_METAL_MODE=SUBMODULE -Cbuild-dir=build
      - name: Retag the Linux wheel for PyPI
        run: |
          shopt -s nullglob
          candidates=(dist/*-cp310-cp310-linux_x86_64.whl)
          test "${#candidates[@]}" -eq 1
          python -m wheel tags --platform-tag=manylinux_2_34_x86_64 --remove "${candidates[0]}"
          test ! -e "${candidates[0]}"
          generic=(dist/*-linux_x86_64.whl)
          test "${#generic[@]}" -eq 0
          final=(dist/*-cp310-cp310-manylinux_2_34_x86_64.whl)
          test "${#final[@]}" -eq 1
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
      - name: Check wheel and installed extension
        run: |
          python -m pip install dist/*-cp310-cp310-manylinux_2_34_x86_64.whl
          python -m pip check
          TT_WAVELET_WHEEL="$(realpath dist/*-cp310-cp310-manylinux_2_34_x86_64.whl)"
          export TT_WAVELET_WHEEL
          cd /tmp
          unset PYTHONPATH LD_LIBRARY_PATH TT_METAL_RUNTIME_ROOT
          python -m pytest "$GITHUB_WORKSPACE/tests/python/test_wheel_package.py" --strict-markers -q
      - uses: actions/upload-artifact@v7
        with:
          name: release-wheel
          path: dist/*-cp310-cp310-manylinux_2_34_x86_64.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/tt-wavelet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
